ktor:
  application:
    modules:
      - com.lucjross.ouija.ApplicationKt.module
  deployment:
    port: 8080

ouija:
  # mic (Deepgram) or stdin (type the lines yourself); from the command line: -P:ouija.input=stdin
  input: ${?OUIJA_INPUT}
  deepgram:
    # supplied through the environment, never written here; see backend/.env.example
    api-key: ${?DEEPGRAM_API_KEY}
    model: nova-3
    language: en-US
    # silence that ends an utterance, in ms
    endpointing-ms: 700
    # biases recognition toward the wake word (Nova-3 keyterm prompting)
    keyterms:
      - Ouija
      - Hey Ouija
  bot:
    # the Nano on the planchette; override with NANO_URL
    base-url: ${?NANO_URL}
    # estimated time the bot needs per spelled letter, until the Nano can report that it is done
    seconds-per-letter: 6
  llm:
    # supplied through the environment; see backend/.env.example
    api-key: ${?ANTHROPIC_API_KEY}
    model: claude-haiku-5-5
    base-url: https://api.anthropic.com
